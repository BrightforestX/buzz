schema_version = "1.3"

[task]
name = "buzz-native/voice-wake-mention"
description = "Agent replies to a wake-stripped kind:9 mention (glasses voice bridge)."
authors = [{ name = "Buzz" }]
keywords = ["buzz-native", "messaging", "voice", "wake-phrase"]

[metadata]
evaluation_layer = "regression"
difficulty = "easy"
category = "collaboration"
tags = ["messaging", "voice", "wake-phrase"]

[agent]
timeout_sec = 300.0

[verifier]
timeout_sec = 30.0

[environment]
network_mode = "public"
cpus = 1
memory_mb = 1024
storage_mb = 1024
